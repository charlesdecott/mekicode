services:
  mekihub:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Le conteneur lance le front mekichat (CMD du Dockerfile = packages/mekichat/app.py),
    # qui crée son propre SessionHub in-process. Le mode headless Discord via mekihub/main.py
    # (MEKIHUB_FRONT / MEKIHUB_DISCORD) n'est pas encore câblé dans l'image — cf. docs/refacto-differe.md.
