<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki learn-claude-code</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<style>
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bg3: #11111b;
    --fg: #cdd6f4; --fg-dim: #9399b2; --accent: #b4befe;
    --border: #313244; --link: #89b4fa; --code-bg: #11111b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 290px; min-width: 290px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px; }
  #sidebar h1 { font-size: 15px; margin: 2px 0 10px; color: var(--accent); }
  #project-select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--accent); background: var(--bg3); color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 12px; cursor: pointer; }
  #search { width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg3); color: var(--fg); margin-bottom: 10px; font-size: 13px; }
  #search:focus { outline: 1px solid var(--accent); }
  .nav-btn { display: block; width: 100%; text-align: left; padding: 7px 10px; margin: 2px 0; border: none; border-radius: 7px; background: transparent; color: var(--fg); cursor: pointer; font-size: 13.5px; }
  .nav-btn:hover { background: var(--border); }
  .nav-btn.active { background: var(--accent); color: var(--bg3); font-weight: 600; }
  .phase-label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg-dim); margin: 14px 0 4px 4px; display: flex; align-items: center; gap: 6px; }
  .phase-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .page-lines { float: right; color: var(--fg-dim); font-size: 11px; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar { background: rgba(24,24,37,.92); border-bottom: 1px solid var(--border); padding: 9px 20px; display: flex; gap: 10px; align-items: center; }
  .top-btn { padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg3); color: var(--fg); cursor: pointer; font-size: 13px; }
  .top-btn:hover:not(:disabled) { border-color: var(--accent); }
  .top-btn.active { background: var(--accent); color: var(--bg3); font-weight: 600; }
  .top-btn:disabled { opacity: .35; cursor: default; }
  #crumb { color: var(--fg-dim); font-size: 13px; margin-left: auto; }
  #workspace { flex: 1; display: flex; overflow: hidden; }
  #content-scroll { flex: 1; overflow-y: auto; min-width: 320px; }
  #content { max-width: 880px; margin: 0 auto; padding: 32px 44px 100px; }
  #content h1 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #content h2 { color: #f5c2e7; margin-top: 36px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
  #content h3 { color: #94e2d5; margin-top: 26px; }
  #content a { color: var(--link); text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content a.wikilink { color: var(--accent); background: rgba(180,190,254,.08); padding: 1px 5px; border-radius: 5px; }
  #content a.lineref { color: #fab387; background: rgba(250,179,135,.1); padding: 0 5px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  #content a.lineref:hover { background: rgba(250,179,135,.25); text-decoration: none; }
  #content blockquote { border-left: 3px solid var(--accent); margin: 0; padding: 4px 18px; background: rgba(180,190,254,.05); border-radius: 0 8px 8px 0; color: var(--fg); }
  #content code { background: var(--code-bg); padding: 2px 6px; border-radius: 5px; font-size: .9em; font-family: 'Cascadia Code', Consolas, monospace; }
  #content pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
  #content pre code { background: none; padding: 0; }
  #content table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  #content th, #content td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  #content th { background: var(--bg2); color: var(--accent); }
  #content tr:nth-child(even) { background: rgba(49,50,68,.3); }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
  .mermaid { background: var(--bg2); border-radius: 10px; padding: 12px; margin: 14px 0; text-align: center; }
  .frontmatter-chip { display: inline-block; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 3px 11px; font-size: 12px; color: var(--fg-dim); margin: 0 6px 14px 0; }
  /* ── Panneau code source ───────────────────────────── */
  #divider { width: 5px; cursor: col-resize; background: var(--border); flex: none; display: none; }
  #divider:hover { background: var(--accent); }
  #codepane { width: 46%; min-width: 280px; max-width: 75%; flex: none; display: none; flex-direction: column; background: var(--bg3); border-left: 1px solid var(--border); }
  #codepane-head { padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--fg-dim); display: flex; align-items: center; gap: 8px; flex: none; }
  #codepane-head .path { font-family: Consolas, monospace; color: #94e2d5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #codepane-head a { color: var(--link); text-decoration: none; flex: none; }
  #codepane-body { flex: 1; overflow: auto; font-family: 'Cascadia Code', Consolas, monospace; font-size: 12.5px; line-height: 1.45; padding: 8px 0; }
  .cl { display: flex; padding: 0 10px 0 0; }
  .cl:hover { background: rgba(180,190,254,.05); }
  .cl.flash { background: rgba(250,179,135,.18); }
  .cl .ln { width: 52px; min-width: 52px; text-align: right; padding-right: 14px; color: #585b70; user-select: none; flex: none; }
  .cl .lc { white-space: pre; }
  /* ── Sommaire (fonctions & classes) ───────────────── */
  #outline { width: 250px; min-width: 250px; flex: none; display: none; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--border); }
  #outline-head { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; letter-spacing: .6px; color: var(--fg-dim); flex: none; }
  #outline-filter { width: 100%; margin-top: 6px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--fg); font-size: 12px; }
  #outline-filter:focus { outline: 1px solid var(--accent); }
  #outline-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .ol-item { display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--fg); cursor: pointer; font-size: 12.5px; font-family: 'Cascadia Code', Consolas, monospace; padding: 3px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ol-item:hover { background: var(--border); }
  .ol-item .ol-kind { display: inline-block; width: 17px; color: #fab387; }
  .ol-item.ol-class .ol-kind { color: #f9e2af; }
  .ol-item.ol-var .ol-kind { color: #89b4fa; }
  .ol-item.ol-method { padding-left: 30px; }
  .ol-item .ol-line { float: right; color: #585b70; font-size: 11px; }
  #outline-controls { display: flex; gap: 4px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .ol-chip { border: 1px solid var(--border); background: var(--bg3); color: var(--fg-dim); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; cursor: pointer; font-family: 'Cascadia Code', Consolas, monospace; }
  .ol-chip:hover { border-color: var(--accent); }
  .ol-chip.active { background: var(--accent); color: var(--bg3); font-weight: 600; border-color: var(--accent); }
  .ol-sep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; }
  /* ── Graphe ───────────────────────────── */
  #graphview { display: none; flex: 1; position: relative; }
  #graph-canvas { height: 100%; }
  #graph-legend { position: absolute; bottom: 18px; left: 18px; background: rgba(24,24,37,.92); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12px; z-index: 6; }
  #graph-legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
</style>
</head>
<body>
  <nav id="sidebar">
    <select id="project-select" title="Choisir le projet"></select>
    <h1 id="sidebar-title">📚 Wiki</h1>
    <input id="search" type="text" placeholder="Filtrer les pages…">
    <div id="nav"></div>
  </nav>
  <div id="main">
    <div id="topbar">
      <button class="top-btn" id="btn-doc" onclick="gotoHome()">📄 Pages</button>
      <button class="top-btn" id="btn-graph" onclick="gotoGraph()">🕸️ Graphe</button>
      <button class="top-btn" id="btn-code" onclick="toggleCode()" disabled title="Afficher le code source complet de la session">💻 Code</button>
      <button class="top-btn" id="btn-outline" onclick="toggleOutline()" disabled title="Sommaire des fonctions et classes du fichier">🧭 Sommaire</button>
      <span id="crumb"></span>
    </div>
    <div id="workspace">
      <div id="content-scroll"><div id="content"></div></div>
      <div id="divider"></div>
      <div id="codepane">
        <div id="codepane-head">
          <span class="path" id="code-path"></span>
          <span id="code-count"></span>
          <a id="code-raw" href="#" target="_blank" title="Ouvrir le fichier brut">brut ↗</a>
        </div>
        <div id="codepane-body"></div>
      </div>
      <div id="outline">
        <div id="outline-head">SOMMAIRE
          <input id="outline-filter" type="text" placeholder="Filtrer par nom…">
          <div id="outline-controls">
            <button class="ol-chip" id="kind-def" title="Afficher/masquer les fonctions et méthodes">ƒ fonctions</button>
            <button class="ol-chip" id="kind-class" title="Afficher/masquer les classes">Ⓒ classes</button>
            <button class="ol-chip" id="kind-var" title="Afficher/masquer les variables de module">ⓥ variables</button>
            <span class="ol-sep"></span>
            <button class="ol-chip" id="sort-line" title="Trier par numéro de ligne">📍 ligne</button>
            <button class="ol-chip" id="sort-alpha" title="Trier par ordre alphabétique">🔤 a→z</button>
            <button class="ol-chip" id="sort-type" title="Trier par type (classes, fonctions, méthodes, variables)">🗂 type</button>
          </div>
        </div>
        <div id="outline-list"></div>
      </div>
    </div>
    <div id="graphview"><div id="graph-canvas"></div><div id="graph-legend"></div></div>
  </div>
<script>
let PROJECTS = null;               // projects.json : {default, projects:[{id,name,dir}]}
let currentProjectId = null;
const projData = {};               // id -> {manifest, graph}
let MANIFEST = null, GRAPH = null, network = null;
let currentFile = null;            // chemin du fichier source de la page courante

function proj() { return PROJECTS.projects.find(p => p.id === currentProjectId); }
function gotoHome() { location.hash = '#/' + currentProjectId + '/p/' + encodeURIComponent(MANIFEST.home); }
function gotoGraph() { location.hash = '#/' + currentProjectId + '/graph'; }
const codeCache = {};              // chemin -> texte
let codeWanted = localStorage.getItem('codepane') !== 'closed'; // préférence utilisateur
let outlineWanted = localStorage.getItem('outline') !== 'closed';
let outlineEntries = [];

const wikilinkExt = {
  name: 'wikilink', level: 'inline',
  start(src) { const i = src.indexOf('[['); return i < 0 ? undefined : i; },
  tokenizer(src) {
    const m = /^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/.exec(src);
    if (m) return { type: 'wikilink', raw: m[0], page: m[1].trim(), text: (m[2] || m[1]).trim() };
  },
  renderer(tok) { return `<a class="wikilink" href="#/${currentProjectId}/p/${encodeURIComponent(tok.page)}">${tok.text}</a>`; }
};
marked.use({ extensions: [wikilinkExt] });
if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

function parseFrontmatter(md) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n/.exec(md);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  for (const line of m[1].split(/\r?\n/)) {
    const kv = /^(\w[\w-]*):\s*(.*)$/.exec(line);
    if (kv) meta[kv[1]] = kv[2].replace(/^["']|["']$/g, '');
  }
  return { meta, body: md.slice(m[0].length) };
}

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* Surligne tout le fichier puis le redécoupe ligne par ligne en préservant
   les <span> hljs multi-lignes (docstrings, etc.) */
function highlightToLines(code) {
  let html;
  try { html = window.hljs ? hljs.highlight(code, { language: 'python' }).value : escapeHtml(code); }
  catch (e) { html = escapeHtml(code); }
  const lines = [];
  const stack = [];
  let cur = '';
  let i = 0;
  while (i < html.length) {
    if (html[i] === '\n') {
      lines.push(cur + '</span>'.repeat(stack.length));
      cur = stack.join('');
      i++;
      continue;
    }
    if (html.startsWith('</span>', i)) { stack.pop(); cur += '</span>'; i += 7; continue; }
    if (html.startsWith('<span', i)) {
      const end = html.indexOf('>', i);
      const tag = html.slice(i, end + 1);
      stack.push(tag); cur += tag; i = end + 1;
      continue;
    }
    cur += html[i++];
  }
  lines.push(cur + '</span>'.repeat(stack.length));
  return lines;
}

async function loadSource(fichier) {
  if (!(fichier in codeCache)) {
    const res = await fetch('/' + encodeURI(fichier));
    codeCache[fichier] = res.ok ? await res.text() : null;
  }
  return codeCache[fichier];
}

async function renderCodePane(fichier) {
  const body = document.getElementById('codepane-body');
  document.getElementById('code-path').textContent = fichier;
  document.getElementById('code-raw').href = '/' + encodeURI(fichier);
  const text = await loadSource(fichier);
  if (text === null) { body.innerHTML = '<p style="padding:20px">⚠️ Impossible de charger le fichier.</p>'; return; }
  const lines = highlightToLines(text.replace(/\r\n/g, '\n'));
  document.getElementById('code-count').textContent = lines.length + ' lignes';
  body.innerHTML = lines.map((l, idx) =>
    `<div class="cl" id="L${idx + 1}"><span class="ln">${idx + 1}</span><span class="lc">${l || ' '}</span></div>`).join('');
  body.scrollTop = 0;
}

/* Parse les def/class/variables du source Python (méthodes indentées sous leur classe,
   variables au niveau module uniquement, première affectation retenue) */
const PY_KEYWORDS = new Set(['if','elif','else','for','while','return','import','from','with','try','except','finally','raise','assert','del','global','nonlocal','pass','lambda','not','and','or','in','is','def','class','async','await','yield','break','continue','match','case','print']);
function buildOutline(text) {
  const entries = [];
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  let currentClass = null, classIndent = 0;
  const seenVars = new Set();
  for (let i = 0; i < lines.length; i++) {
    const m = /^(\s*)(?:async\s+)?(def|class)\s+(\w+)/.exec(lines[i]);
    if (m) {
      const indent = m[1].length, kind = m[2], name = m[3];
      if (kind === 'class') {
        entries.push({ name, line: i + 1, type: 'class' });
        currentClass = name; classIndent = indent;
      } else if (indent === 0 || currentClass === null || indent <= classIndent) {
        entries.push({ name, line: i + 1, type: 'def' });
        currentClass = null;
      } else {
        entries.push({ name, line: i + 1, type: 'method', parent: currentClass });
      }
      continue;
    }
    // variable de module : affectation au niveau 0, annotation de type optionnelle
    const v = /^([A-Za-z_]\w*)\s*(?::[^=]+?)?\s*=(?!=)/.exec(lines[i]);
    if (v && !PY_KEYWORDS.has(v[1]) && !seenVars.has(v[1])) {
      seenVars.add(v[1]);
      entries.push({ name: v[1], line: i + 1, type: 'var' });
    }
  }
  return entries;
}

const OL_ICONS = { class: 'Ⓒ', def: 'ƒ', method: 'ƒ', var: 'ⓥ' };
const OL_TYPE_ORDER = { class: 0, def: 1, method: 2, var: 3 };
let olKinds = JSON.parse(localStorage.getItem('outline-kinds') || '{"def":true,"class":true,"var":true}');
let olSort = localStorage.getItem('outline-sort') || 'line';

function renderOutline(filter = '') {
  const list = document.getElementById('outline-list');
  const f = filter.toLowerCase();
  let entries = outlineEntries.filter(e => {
    const kindKey = (e.type === 'method') ? 'def' : e.type;
    if (!olKinds[kindKey]) return false;
    return !f || e.name.toLowerCase().includes(f) || (e.parent || '').toLowerCase().includes(f);
  });
  if (olSort === 'alpha') entries = entries.slice().sort((a, b) => a.name.localeCompare(b.name));
  else if (olSort === 'type') entries = entries.slice().sort((a, b) => (OL_TYPE_ORDER[a.type] - OL_TYPE_ORDER[b.type]) || a.name.localeCompare(b.name));
  else entries = entries.slice().sort((a, b) => a.line - b.line);
  const items = entries
    .map(e => `<button class="ol-item ol-${e.type}" data-line="${e.line}" title="${e.parent ? e.parent + '.' : ''}${e.name} — ligne ${e.line}"><span class="ol-kind">${OL_ICONS[e.type]}</span>${e.name}<span class="ol-line">${e.line}</span></button>`)
    .join('');
  list.innerHTML = items || '<p style="color:var(--fg-dim);font-size:12px;padding:0 12px">Aucun résultat</p>';
  updateOutlineControls();
}

function updateOutlineControls() {
  document.getElementById('kind-def').classList.toggle('active', !!olKinds.def);
  document.getElementById('kind-class').classList.toggle('active', !!olKinds.class);
  document.getElementById('kind-var').classList.toggle('active', !!olKinds.var);
  document.getElementById('sort-line').classList.toggle('active', olSort === 'line');
  document.getElementById('sort-alpha').classList.toggle('active', olSort === 'alpha');
  document.getElementById('sort-type').classList.toggle('active', olSort === 'type');
}

function setOutlineKind(kind) {
  olKinds[kind] = !olKinds[kind];
  localStorage.setItem('outline-kinds', JSON.stringify(olKinds));
  renderOutline(document.getElementById('outline-filter').value);
}

function setOutlineSort(sort) {
  olSort = sort;
  localStorage.setItem('outline-sort', sort);
  renderOutline(document.getElementById('outline-filter').value);
}

async function updateCodePane() {
  const pane = document.getElementById('codepane');
  const divider = document.getElementById('divider');
  const btn = document.getElementById('btn-code');
  const show = !!currentFile && codeWanted;
  pane.style.display = show ? 'flex' : 'none';
  divider.style.display = show ? 'block' : 'none';
  btn.disabled = !currentFile;
  btn.classList.toggle('active', show);
  if (show) renderCodePane(currentFile);
  // sommaire
  const ol = document.getElementById('outline');
  const btnOl = document.getElementById('btn-outline');
  const showOl = !!currentFile && outlineWanted;
  ol.style.display = showOl ? 'flex' : 'none';
  btnOl.disabled = !currentFile;
  btnOl.classList.toggle('active', showOl);
  if (showOl) {
    const text = await loadSource(currentFile);
    outlineEntries = text ? buildOutline(text) : [];
    renderOutline(document.getElementById('outline-filter').value);
  }
}

function toggleCode() {
  codeWanted = !codeWanted;
  localStorage.setItem('codepane', codeWanted ? 'open' : 'closed');
  updateCodePane();
}

function toggleOutline() {
  outlineWanted = !outlineWanted;
  localStorage.setItem('outline', outlineWanted ? 'open' : 'closed');
  updateCodePane();
}

async function jumpToLine(from, to) {
  if (!currentFile) return;
  if (!codeWanted) { codeWanted = true; localStorage.setItem('codepane', 'open'); updateCodePane(); }
  // attendre que le pane soit rendu
  let lineEl = null;
  for (let t = 0; t < 30 && !lineEl; t++) {
    lineEl = document.getElementById('L' + from);
    if (!lineEl) await new Promise(r => setTimeout(r, 100));
  }
  if (!lineEl) return;
  const body = document.getElementById('codepane-body');
  body.scrollTop = lineEl.offsetTop - body.clientHeight / 4;
  document.querySelectorAll('.cl.flash').forEach(e => e.classList.remove('flash'));
  for (let n = from; n <= Math.min(to, from + 400); n++) {
    const e = document.getElementById('L' + n);
    if (e) e.classList.add('flash');
  }
  setTimeout(() => document.querySelectorAll('.cl.flash').forEach(e => e.classList.remove('flash')), 2600);
}

/* Rend cliquables les mentions « lignes X–Y » / « ligne N » du texte de la page */
function linkifyLineRefs(rootEl) {
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (n.parentElement.closest('pre, a')) return NodeFilter.FILTER_REJECT;
      return /\blignes?\s+\d/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const re = /\blignes?\s+(\d+)(?:\s*[–—-]\s*(\d+))?/g;
  for (const n of nodes) {
    const text = n.nodeValue;
    const frag = document.createDocumentFragment();
    let cursor = 0, match, any = false;
    re.lastIndex = 0;
    while ((match = re.exec(text))) {
      any = true;
      frag.appendChild(document.createTextNode(text.slice(cursor, match.index)));
      const a = document.createElement('a');
      a.className = 'lineref';
      a.textContent = match[0];
      a.dataset.from = match[1];
      a.dataset.to = match[2] || match[1];
      frag.appendChild(a);
      cursor = match.index + match[0].length;
    }
    if (any) {
      frag.appendChild(document.createTextNode(text.slice(cursor)));
      n.parentNode.replaceChild(frag, n);
    }
  }
}

async function loadPage(page) {
  document.getElementById('graphview').style.display = 'none';
  document.getElementById('workspace').style.display = 'flex';
  document.getElementById('btn-doc').classList.add('active');
  document.getElementById('btn-graph').classList.remove('active');
  const el = document.getElementById('content');
  try {
    const res = await fetch('/' + proj().dir + '/' + encodeURIComponent(page) + '.md');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { meta, body } = parseFrontmatter(await res.text());
    let chips = '';
    if (meta.fichier) chips += `<span class="frontmatter-chip">📁 ${meta.fichier}</span>`;
    if (meta.lignes) chips += `<span class="frontmatter-chip">📏 ${meta.lignes} lignes</span>`;
    if (meta.phase && meta.phase !== 'Accueil') chips += `<span class="frontmatter-chip">🗂️ ${meta.phase}</span>`;
    el.innerHTML = chips + marked.parse(body);
    if (window.hljs) {
      el.querySelectorAll('pre code').forEach(b => {
        if (b.classList.contains('language-mermaid')) return;
        try { hljs.highlightElement(b); } catch (e) { /* coloration facultative */ }
      });
    }
    if (window.mermaid) {
      let mi = 0;
      for (const b of el.querySelectorAll('pre code.language-mermaid')) {
        const div = document.createElement('div');
        div.className = 'mermaid';
        try {
          const { svg } = await mermaid.render('mmd' + Date.now() + '_' + (mi++), b.textContent);
          div.innerHTML = svg;
        } catch (e) { div.textContent = '⚠️ diagramme mermaid invalide'; }
        b.closest('pre').replaceWith(div);
      }
    }
    currentFile = meta.fichier || null;
    if (currentFile) linkifyLineRefs(el);
    updateCodePane();
    document.getElementById('crumb').textContent = meta.title || page;
    document.title = (meta.title || page) + ' — ' + (MANIFEST.title || 'Wiki');
    document.getElementById('content-scroll').scrollTop = 0;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  } catch (e) {
    console.error('loadPage error:', e);
    currentFile = null;
    updateCodePane();
    el.innerHTML = `<h1>Erreur de chargement</h1><p>« ${page} » : <code>${String(e.message || e)}</code></p><pre>${String(e.stack || '')}</pre><p><a href="#/p/Accueil">Retour à l'accueil</a></p>`;
  }
}

function showGraph() {
  document.getElementById('workspace').style.display = 'none';
  document.getElementById('graphview').style.display = 'block';
  document.getElementById('btn-graph').classList.add('active');
  document.getElementById('btn-doc').classList.remove('active');
  document.getElementById('btn-code').disabled = true;
  document.getElementById('btn-outline').disabled = true;
  document.getElementById('crumb').textContent = 'Graphe — ' + (MANIFEST.title || currentProjectId);
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (!window.vis) { document.getElementById('graph-canvas').innerHTML = '<p style="padding:30px">⚠️ vis-network (CDN) n\'a pas pu être chargé.</p>'; return; }
  if (network) return;
  const nodes = GRAPH.nodes.map(n => ({
    id: n.id, label: n.label, value: n.value,
    color: { background: n.color, border: n.color, highlight: { background: '#fff', border: n.color } },
    font: { color: '#cdd6f4', size: 13, multi: false }
  }));
  const styles = {
    progression: { color: '#6c7086', width: 2.2, arrows: 'to' },
    thematique: { color: '#f5c2e7', width: 1.4, dashes: [6, 5], arrows: 'to' },
    integre: { color: '#45475a', width: 1, dashes: [2, 5], arrows: 'to' },
    imports: { color: '#94e2d5', width: 1, dashes: [3, 4], arrows: 'to' }
  };
  const edges = GRAPH.edges.map(e => ({ from: e.from, to: e.to, ...styles[e.type] }));
  network = new vis.Network(document.getElementById('graph-canvas'),
    { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
    {
      nodes: { shape: 'dot', scaling: { min: 12, max: 34 }, borderWidth: 2 },
      edges: { smooth: { type: 'continuous' } },
      physics: { barnesHut: { gravitationalConstant: -5500, springLength: 130, springConstant: 0.02 }, stabilization: { iterations: 250 } },
      interaction: { hover: true }
    });
  network.on('click', p => { if (p.nodes.length) location.hash = '#/' + currentProjectId + '/p/' + p.nodes[0]; });
  const legend = document.getElementById('graph-legend');
  const phaseColors = {};
  GRAPH.nodes.forEach(n => phaseColors[n.phase] = n.color);
  const edgeLabels = {
    progression: ['━━', '#6c7086', 'progression'],
    thematique: ['╌╌', '#f5c2e7', 'lien thématique'],
    integre: ['┈┈', '#45475a', 'intégré dans le capstone'],
    imports: ['┄┄', '#94e2d5', 'importe le socle']
  };
  const edgeTypes = [...new Set(GRAPH.edges.map(e => e.type))];
  legend.innerHTML = Object.entries(phaseColors).map(([p, c]) =>
    `<div><span class="phase-dot" style="background:${c}"></span>${p}</div>`).join('') +
    edgeTypes.filter(t => edgeLabels[t]).map((t, i) =>
      `<div${i === 0 ? ' style="margin-top:6px"' : ''}><span style="color:${edgeLabels[t][1]}">${edgeLabels[t][0]}</span> ${edgeLabels[t][2]}</div>`).join('') +
    `<div style="margin-top:6px;color:#9399b2">clic = ouvrir la page</div>`;
}

function buildNav(filter = '') {
  const nav = document.getElementById('nav');
  const f = filter.toLowerCase();
  const groups = {};
  for (const p of MANIFEST.pages) {
    if (f && !(p.title.toLowerCase().includes(f) || p.page.toLowerCase().includes(f) || (p.summary || '').toLowerCase().includes(f))) continue;
    (groups[p.phase] = groups[p.phase] || []).push(p);
  }
  const phaseColors = {};
  if (GRAPH) GRAPH.nodes.forEach(n => phaseColors[n.phase] = n.color);
  let html = '';
  for (const phase of ['Accueil', ...MANIFEST.phases]) {
    if (!groups[phase]) continue;
    if (phase !== 'Accueil') html += `<div class="phase-label"><span class="phase-dot" style="background:${phaseColors[phase] || '#888'}"></span>${phase}</div>`;
    for (const p of groups[phase]) {
      html += `<button class="nav-btn" data-page="${p.page}" onclick="location.hash='#/${currentProjectId}/p/${encodeURIComponent(p.page)}'" title="${p.summary || ''}">${p.title}${p.lignes ? `<span class="page-lines">${p.lignes}l</span>` : ''}</button>`;
    }
  }
  nav.innerHTML = html || '<p style="color:var(--fg-dim);font-size:13px">Aucun résultat</p>';
  const cur = currentPage();
  if (cur) document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === cur));
}

function parseHash() {
  const h = location.hash;
  let m = /^#\/([\w-]+)\/graph$/.exec(h);
  if (m) return { pid: m[1], view: 'graph' };
  m = /^#\/([\w-]+)\/p\/(.+)$/.exec(h);
  if (m) return { pid: m[1], view: 'page', page: decodeURIComponent(m[2]) };
  // anciens liens sans projet
  m = /^#\/p\/(.+)$/.exec(h);
  if (m) return { pid: PROJECTS.default, view: 'page', page: decodeURIComponent(m[1]) };
  if (h === '#/graph') return { pid: PROJECTS.default, view: 'graph' };
  return { pid: localStorage.getItem('project') || PROJECTS.default, view: 'page', page: null };
}

function currentPage() {
  if (!PROJECTS) return null;
  const r = parseHash();
  return r.view === 'page' ? r.page : null;
}

async function ensureProject(pid) {
  if (!PROJECTS.projects.some(p => p.id === pid)) pid = PROJECTS.default;
  if (!projData[pid]) {
    const dir = PROJECTS.projects.find(p => p.id === pid).dir;
    const [manifest, graph] = await Promise.all([
      fetch('/' + dir + '/_manifest.json').then(r => r.json()),
      fetch('/' + dir + '/_graph.json').then(r => r.json()).catch(() => ({ nodes: [], edges: [] }))
    ]);
    projData[pid] = { manifest, graph };
  }
  const changed = currentProjectId !== pid;
  currentProjectId = pid;
  localStorage.setItem('project', pid);
  MANIFEST = projData[pid].manifest;
  GRAPH = projData[pid].graph;
  document.getElementById('project-select').value = pid;
  document.getElementById('sidebar-title').textContent = '📚 ' + (MANIFEST.title || pid);
  if (changed && network) { network.destroy(); network = null; }
  if (changed) buildNav(document.getElementById('search').value);
  return pid;
}

async function route() {
  const r = parseHash();
  await ensureProject(r.pid);
  if (r.view === 'graph') return showGraph();
  loadPage(r.page || MANIFEST.home);
}

window.addEventListener('hashchange', route);
document.getElementById('search').addEventListener('input', e => buildNav(e.target.value));
document.getElementById('content').addEventListener('click', e => {
  const ref = e.target.closest('a.lineref');
  if (ref) { e.preventDefault(); jumpToLine(Number(ref.dataset.from), Number(ref.dataset.to)); }
});
document.getElementById('outline-list').addEventListener('click', e => {
  const item = e.target.closest('.ol-item');
  if (item) jumpToLine(Number(item.dataset.line), Number(item.dataset.line));
});
document.getElementById('outline-filter').addEventListener('input', e => renderOutline(e.target.value));
document.getElementById('kind-def').addEventListener('click', () => setOutlineKind('def'));
document.getElementById('kind-class').addEventListener('click', () => setOutlineKind('class'));
document.getElementById('kind-var').addEventListener('click', () => setOutlineKind('var'));
document.getElementById('sort-line').addEventListener('click', () => setOutlineSort('line'));
document.getElementById('sort-alpha').addEventListener('click', () => setOutlineSort('alpha'));
document.getElementById('sort-type').addEventListener('click', () => setOutlineSort('type'));

/* Redimensionnement du panneau code */
(() => {
  const divider = document.getElementById('divider');
  const pane = document.getElementById('codepane');
  let dragging = false;
  divider.addEventListener('mousedown', e => { dragging = true; e.preventDefault(); document.body.style.userSelect = 'none'; });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const main = document.getElementById('main').getBoundingClientRect();
    const w = Math.min(Math.max(main.right - e.clientX, 280), main.width * 0.75);
    pane.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; document.body.style.userSelect = ''; });
})();

document.getElementById('project-select').addEventListener('change', async e => {
  const pid = e.target.value;
  await ensureProject(pid);
  location.hash = '#/' + pid + '/p/' + encodeURIComponent(MANIFEST.home);
});

(async () => {
  PROJECTS = await fetch('/projects.json').then(r => r.json());
  const sel = document.getElementById('project-select');
  sel.innerHTML = PROJECTS.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  await route();
})();
</script>
